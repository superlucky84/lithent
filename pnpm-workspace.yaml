packages:
  - 'lithentConcurrent'
  - 'lithentConcurrent/helper'
  - 'lithentConcurrent/consumer'
  - 'helper'
  - 'devHelper'
  - 'ssr'
  - 'tag'
  - 'ftags'
  - 'element'
  - 'examples'
  - 'jsx-runtime'
  - 'lithentDocs'
  - 'createLithent'
  - 'createLithent/express'
  - 'createLithent/basic'
  - 'packages/hmrParser'
  - 'packages/lithentVite'
  - 'packages/lithentMdx'
  - 'packages/lithentTemplateVite'
  - 'packages/lithentTemplateParser'

autoInstallPeers: true
linkWorkspacePackages: true

# Dependencies allowed to run install scripts. msw's postinstall only copies
# its service worker into configured directories, and none is configured.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  msw: false
